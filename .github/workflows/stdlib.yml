name: Update Standard Library Documentation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stdlib-docs:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup C3 Compiler
        id: setup-c3
        uses: ManuLinares/setup-c3@v1
        with:
          version: nightly

      - name: Generate documentation
        working-directory: ${{ steps.setup-c3.outputs.c3c-path }}
        run: |
          c3c docgen lib/std --target linux-x64 --append
          c3c docgen lib/std --target windows-x64 --append
          c3c docgen lib/std --target macos-aarch64 --append

      - name: Copy documentation
        run: |
          mkdir -p docs/standard-library
          cp "${{ steps.setup-c3.outputs.c3c-path }}/docs.html" docs/standard-library/docs.html

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/standard-library/docs.html

          # Only commit if there are changes
          if ! git diff-index --quiet HEAD --; then
            git commit -m "docs: auto-update standard library docs.html"
            git push
          else
            echo "No changes to commit"
          fi
